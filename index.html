<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c10" />
  <meta name="description" content="Mabast AI — شوێنی تایبەتی تۆ بۆ گفتوگۆ، داهێنان و کارکردن بە AI." />
  <title>Mabast AI — شوێنی کارکردنی زیرەک</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#chat" aria-label="Mabast AI"><span class="brand-mark">✦</span><span>Mabast <b>AI</b></span></a>
      <button class="new-chat" id="newChat"><span>＋</span> گفتوگۆی نوێ <kbd>⌘ K</kbd></button>
      <nav class="primary-nav" aria-label="سەرەکی">
        <button class="nav-item active" data-view="chat"><span>▤</span> چات <small>↵</small></button>
        <button class="nav-item" data-view="images"><span>✧</span> ستۆدیۆی وێنە <em>نوێ</em></button>
        <button class="nav-item" data-view="library"><span>▧</span> کتێبخانە</button>
      </nav>
      <div class="side-heading"><span>مێژووی گفتوگۆ</span><button id="searchToggle" title="گەڕان">⌕</button></div>
      <div class="search-box" id="searchBox"><input id="historySearch" placeholder="گەڕان لە گفتوگۆکان..." /></div>
      <div class="history-list" id="historyList"></div>
      <div class="sidebar-bottom">
        <div class="upgrade"><span class="upgrade-star">✦</span><div><b>Mabast AI workspace</b><small>شوێنێک بۆ بیرۆکە گەورەکانت</small></div></div>
        <button class="account" id="settingsNav"><span class="account-avatar">M</span><span><b>Mabast</b><small>ڕێکخستنەکان</small></span><i>•••</i></button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <div class="top-left"><button class="icon-btn menu-btn" id="menuToggle" aria-label="مێنیو">☰</button><div class="model-select"><span class="online-dot"></span><b>Mabast AI</b><span>⌄</span></div></div>
        <div class="top-right"><span class="workspace-label">شوێنی کاری تایبەتی</span><button class="icon-btn" id="themeToggle" aria-label="گۆڕینی ڕووناکی" title="گۆڕینی دۆخ">☼</button></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
      <footer class="footer-note">Mabast AI لە دۆخی پێش‌نمایشدایە · بۆ وەڵامی ڕاستەقینە و پاراستنی داتا، پەیوەندیی سێرڤەر و AI API پێویستە.</footer>
    </main>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden />
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
